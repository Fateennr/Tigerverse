
services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - player-service
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    container_name: auth-service
    env_file:
      - ./.env
    depends_on:
      - redis
    restart: unless-stopped

  player-service:
    build: ./player-service
    container_name: player-service
    env_file:
      - ./.env
    depends_on:
      - redis
      - auth-service
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: